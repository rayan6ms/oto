[workspace]
members = ["crates/oto", "crates/oto-testkit"]
exclude = ["fuzz", "vendor/davey", "vendor/openmls_rust_crypto"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
homepage = "https://github.com/rayan6ms/oto"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rayan6ms/oto"
rust-version = "1.97"

[workspace.dependencies]
aes-gcm = "0.11.0"
chacha20poly1305 = "0.11.0"
davey = { path = "vendor/davey" }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[patch.crates-io]
openmls_rust_crypto = { path = "vendor/openmls_rust_crypto" }
