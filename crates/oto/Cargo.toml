[package]
name = "oto"
version.workspace = true
description = "Rust-native Discord Voice Gateway, UDP/RTP, transport encryption, DAVE, and paced Opus transport"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
experimental-audio-worker = []
testkit = ["dep:rustls"]

[dependencies]
aes-gcm.workspace = true
chacha20poly1305.workspace = true
davey.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rtrb.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["net", "time", "std"] }

[dev-dependencies]
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
oto-testkit = { path = "../oto-testkit" }
rustls.workspace = true
stats_alloc = "0.1.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
